<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Eyes</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button class="wordmark" data-go="now">Eyes</button>
    <span class="project" id="project">…</span>
    <button class="finder" id="open-find">
      <span>Search or ask…</span><kbd>⌘K</kbd>
    </button>
    <button class="ghost" id="brief-me" title="Read this screen out loud">
      <span aria-hidden="true">◑</span> Brief me
    </button>
    <button class="ghost" id="theme" title="Light or dark" aria-label="Switch theme">◐</button>
    <button class="ghost" id="register" title="The same facts, told plainly">Plain view</button>
    <span class="tree-drift" id="drift" hidden></span>
    <span class="freshness" id="freshness">reading the graph…</span>
    <span class="readonly" title="Eyes never writes. It shows you the command instead.">read only</span>
  </header>

  <nav class="rail" aria-label="Sections">
    <span class="rail-group">Operate</span>
    <button data-go="now" data-icon="now" class="on">
      <span class="rail-mark" aria-hidden="true">◍</span><span>Now</span>
      <span class="rail-count" data-count="now" hidden></span>
    </button>
    <button data-go="next" data-icon="chevron">
      <span class="rail-mark" aria-hidden="true">▹</span><span>Next</span>
      <span class="rail-count" data-count="next" hidden></span>
    </button>
    <button data-go="work" data-icon="orbit">
      <span class="rail-mark" aria-hidden="true">◔</span><span>Work</span>
      <span class="rail-count" data-count="work" hidden></span>
    </button>
    <span class="rail-group">Plan</span>
    <button data-go="roadmap" data-icon="chevron" data-plain>
      <span class="rail-mark" aria-hidden="true">▸</span><span>Roadmap</span>
      <span class="rail-count" data-count="roadmap" hidden></span>
    </button>
    <button data-go="features" data-icon="hexagon" data-plain>
      <span class="rail-mark" aria-hidden="true">⬡</span><span>Features</span>
      <span class="rail-count" data-count="features" hidden></span>
    </button>
    <button data-go="media" data-icon="page" data-plain-only>
      <span class="rail-mark" aria-hidden="true">▣</span><span>Tour</span>
    </button>
    <span class="rail-group">Prove</span>
    <button data-go="tests" data-icon="diamond">
      <span class="rail-mark" aria-hidden="true">◈</span><span>Tests</span>
      <span class="rail-count" data-count="tests" hidden></span>
    </button>
    <button data-go="library" data-icon="page">
      <span class="rail-mark" aria-hidden="true">▤</span><span>Artifacts</span>
      <span class="rail-count" data-count="library" hidden></span>
    </button>
    <button data-go="evidence" data-icon="seal">
      <span class="rail-mark" aria-hidden="true">◇</span><span>Evidence</span>
      <span class="rail-count" data-count="evidence" hidden></span>
    </button>
    <span class="rail-group">Explore</span>
    <button data-go="timeline" data-icon="history">
      <span class="rail-mark" aria-hidden="true">⋮</span><span>History</span>
    </button>
    <button data-go="compare" data-icon="history">
      <span class="rail-mark" aria-hidden="true">⇄</span><span>Compare</span>
    </button>
    <button data-go="map" data-icon="map">
      <span class="rail-mark" aria-hidden="true">▦</span><span>Map</span>
    </button>
    <button data-go="mri" data-icon="mri" class="rail-mri">
      <span class="rail-mark" aria-hidden="true">◉</span><span>MRI</span>
      <span class="rail-live" data-live hidden></span>
    </button>
  </nav>

  <!--SPRITE-->

  <main id="stage" class="stage" tabindex="-1">
    <p class="loading">Reading the graph…</p>
  </main>

  <aside class="inspector" id="inspector" hidden aria-label="Inspector">
    <div class="inspector-head">
      <span class="glyph" id="inspector-glyph"></span>
      <div>
        <p class="inspector-kind" id="inspector-kind"></p>
        <h2 id="inspector-title"></h2>
      </div>
      <button class="ghost" id="inspector-close" aria-label="Close">✕</button>
    </div>
    <div class="inspector-body" id="inspector-body"></div>
  </aside>

  <div class="finder-overlay" id="find-overlay" hidden>
    <div class="finder-panel" role="dialog" aria-label="Search or ask">
      <input id="find-input" type="search"
             placeholder="Search names, paths and titles…"
             autocomplete="off" spellcheck="false">
      <div class="finder-results" id="find-results"></div>
    </div>
  </div>
</body>
</html>
