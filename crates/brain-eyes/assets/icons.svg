<!-- The shape vocabulary.
     One symbol per kind, drawn on a 34×34 grid with a 2.2 stroke, so a
     kind is recognisable before its label is read and colour never has to
     carry meaning alone. The MRI rasterises the same geometry into its
     glyph atlas, so the flat views and the anatomy agree about what a
     thing looks like.
     Inlined into the page at startup; nothing is fetched. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- feature: hexagon — a thing composed of facets -->
  <symbol id="i-hexagon" viewBox="0 0 34 34">
    <polygon points="17,4 28,10.5 28,23.5 17,30 6,23.5 6,10.5" stroke-linejoin="round"/>
  </symbol>

  <!-- test / run: diamond — a checkpoint -->
  <symbol id="i-diamond" viewBox="0 0 34 34">
    <polygon points="17,5 29,17 17,29 5,17" stroke-linejoin="round"/>
  </symbol>

  <!-- decision: kite — an arrowhead, something that points forward -->
  <symbol id="i-kite" viewBox="0 0 34 34">
    <polygon points="17,4 30,17 17,22 4,17" stroke-linejoin="round"/>
  </symbol>

  <!-- document: a page with a folded corner -->
  <symbol id="i-page" viewBox="0 0 34 34">
    <polygon points="8,5 22,5 27,10 27,29 8,29" stroke-linejoin="round"/>
    <polyline points="22,5 22,10 27,10" stroke-linejoin="round"/>
  </symbol>

  <!-- source file: rounded square — a block of implementation -->
  <symbol id="i-block" viewBox="0 0 34 34">
    <rect x="7" y="7" width="20" height="20" rx="3"/>
  </symbol>

  <!-- media: a landscape frame -->
  <symbol id="i-frame" viewBox="0 0 34 34">
    <rect x="5" y="8" width="24" height="18" rx="2"/>
    <polyline points="9,22 15,16 20,21 25,17" stroke-linejoin="round"/>
  </symbol>

  <!-- governed change: a chevron — a directional act -->
  <symbol id="i-chevron" viewBox="0 0 34 34">
    <polygon points="7,6 21,6 28,17 21,28 7,28 14,17" stroke-linejoin="round"/>
  </symbol>

  <!-- contract / template: a shield — something that guards a shape -->
  <symbol id="i-shield" viewBox="0 0 34 34">
    <path d="M17 4 L28 9 L26 22 L17 30 L8 22 L6 9 Z" stroke-linejoin="round"/>
  </symbol>

  <!-- agent session: an orbit — work that circles the code -->
  <symbol id="i-orbit" viewBox="0 0 34 34">
    <ellipse cx="17" cy="17" rx="13" ry="6.5" transform="rotate(-28 17 17)"/>
    <circle cx="17" cy="17" r="3.4"/>
  </symbol>

  <!-- external dependency: a circle, outside the workspace -->
  <symbol id="i-circle" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="11"/>
  </symbol>

  <!-- symbol: a smaller mark for a function or type -->
  <symbol id="i-dot" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="6"/>
  </symbol>

  <!-- repository: nested brackets, the whole enclosing thing -->
  <symbol id="i-repo" viewBox="0 0 34 34">
    <path d="M12 6 H8 a2 2 0 0 0 -2 2 V26 a2 2 0 0 0 2 2 h4" stroke-linecap="round"/>
    <path d="M22 6 h4 a2 2 0 0 1 2 2 V26 a2 2 0 0 1 -2 2 h-4" stroke-linecap="round"/>
    <line x1="17" y1="11" x2="17" y2="23" stroke-linecap="round"/>
  </symbol>

  <!-- evidence: a seal -->
  <symbol id="i-seal" viewBox="0 0 34 34">
    <circle cx="17" cy="15" r="9"/>
    <polyline points="12,28 17,24 22,28" stroke-linejoin="round"/>
  </symbol>

  <!-- ---- the conventional dimensions of a feature ---- -->

  <!-- core: a filled centre inside a boundary -->
  <symbol id="i-core" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="11"/>
    <circle cx="17" cy="17" r="4"/>
  </symbol>

  <!-- api: a socket — two things meeting at a defined edge -->
  <symbol id="i-api" viewBox="0 0 34 34">
    <path d="M6 12 h9 a5 5 0 0 1 0 10 H6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 12 h-9 a5 5 0 0 0 0 10 h9" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ux: a window with a header bar -->
  <symbol id="i-ux" viewBox="0 0 34 34">
    <rect x="5" y="7" width="24" height="20" rx="2.5"/>
    <line x1="5" y1="14" x2="29" y2="14"/>
  </symbol>

  <!-- docs: stacked pages -->
  <symbol id="i-docs" viewBox="0 0 34 34">
    <rect x="6" y="5" width="16" height="20" rx="2"/>
    <path d="M12 29 h14 a2 2 0 0 0 2 -2 V11" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- ---- interface marks ---- -->

  <symbol id="i-search" viewBox="0 0 34 34">
    <circle cx="15" cy="15" r="8"/>
    <line x1="21" y1="21" x2="28" y2="28" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-now" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="11"/>
    <polyline points="17,10 17,17 22,20" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-history" viewBox="0 0 34 34">
    <line x1="17" y1="5" x2="17" y2="29" stroke-linecap="round"/>
    <circle cx="17" cy="11" r="2.6"/>
    <circle cx="17" cy="22" r="2.6"/>
  </symbol>
  <symbol id="i-map" viewBox="0 0 34 34">
    <rect x="5" y="6" width="10" height="10" rx="1.5"/>
    <rect x="19" y="6" width="10" height="10" rx="1.5"/>
    <rect x="12" y="20" width="10" height="8" rx="1.5"/>
  </symbol>
  <symbol id="i-mri" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="12"/>
    <ellipse cx="17" cy="17" rx="12" ry="5"/>
    <circle cx="17" cy="17" r="2.6"/>
  </symbol>
</svg>
